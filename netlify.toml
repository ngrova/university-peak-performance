[build]
  command = "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile && pnpm --filter @upp/thriving-mobile build"
  publish = "apps/thriving-mobile/.next"
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF HEAD -- apps/thriving-mobile/ packages/ netlify/ package.json pnpm-lock.yaml"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[functions."fleet-sync"]
  node_bundler = "esbuild"

# Route fleet-sync requests to our function before the Next.js
# plugin's catch-all rewrite intercepts them
[[redirects]]
  from = "/.netlify/functions/fleet-sync"
  to = "/.netlify/functions/fleet-sync"
  status = 200
  force = true

[[plugins]]
  package = "@netlify/plugin-nextjs"
