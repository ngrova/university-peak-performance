name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  dead-code-check:
    name: Dead Code Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-dead-code.js

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit tests
        id: unit
        working-directory: apps/thriving-mobile
        run: |
          pnpm exec vitest run --reporter=json --outputFile=/tmp/unit-results.json 2>&1 | tee /tmp/unit-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
      - name: Parse unit test results
        id: unit_results
        if: always()
        run: |
          if [ -f /tmp/unit-results.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('/tmp/unit-results.json','utf8'));
              const total = r.numTotalTests || 0;
              const passed = r.numPassedTests || 0;
              const failed = r.numFailedTests || 0;
              const skipped = r.numPendingTests || 0;
              console.log('total=' + total);
              console.log('passed=' + passed);
              console.log('failed=' + failed);
              console.log('skipped=' + skipped);
            " >> $GITHUB_OUTPUT
          else
            echo 'total=0' >> $GITHUB_OUTPUT
          fi
      - name: Verify unit tests actually ran
        if: always()
        run: |
          TOTAL="${{ steps.unit_results.outputs.total }}"
          if [ "$TOTAL" = "0" ]; then
            echo "::error::Zero unit tests ran. CI requires at least one unit test to execute."
            exit 1
          fi
          echo "Unit test summary: ${{ steps.unit_results.outputs.total }} total, ${{ steps.unit_results.outputs.passed }} passed, ${{ steps.unit_results.outputs.failed }} failed, ${{ steps.unit_results.outputs.skipped }} skipped"
      - name: Fail on unit test failures
        if: always()
        run: |
          if [ "${{ steps.unit.outputs.exit_code }}" != "0" ]; then
            echo "::error::Unit tests failed"
            exit 1
          fi

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: apps/thriving-mobile
      - name: Run E2E tests
        id: e2e
        working-directory: apps/thriving-mobile
        run: |
          npx playwright test --reporter=json 2>/dev/null | tee /tmp/test-results.json || true
          npx playwright test 2>&1 | tee /tmp/test-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
      - name: Parse test results
        id: results
        if: always()
        run: |
          if [ -f /tmp/test-results.json ]; then
            node -e "
              const r = JSON.parse(require('fs').readFileSync('/tmp/test-results.json','utf8'));
              const s = r.stats || {};
              // Playwright's stats.expected is 'tests that passed as expected', NOT total.
              // Total = expected + unexpected + skipped + flaky.
              const expected = s.expected || 0;
              const unexpected = s.unexpected || 0;
              const skipped = s.skipped || 0;
              const flaky = s.flaky || 0;
              const total = expected + unexpected + skipped + flaky;
              const passed = expected + flaky;
              const failed = unexpected;
              console.log('total=' + total);
              console.log('passed=' + passed);
              console.log('failed=' + failed);
              console.log('skipped=' + skipped);
            " >> $GITHUB_OUTPUT
          else
            echo 'total=0' >> $GITHUB_OUTPUT
            echo 'passed=0' >> $GITHUB_OUTPUT
            echo 'failed=0' >> $GITHUB_OUTPUT
            echo 'skipped=0' >> $GITHUB_OUTPUT
          fi
      - name: Verify tests actually ran
        if: always()
        run: |
          TOTAL="${{ steps.results.outputs.total }}"
          if [ "$TOTAL" = "0" ]; then
            echo "::error::Zero tests ran. CI requires at least one test to execute."
            exit 1
          fi
          echo "Test summary: ${{ steps.results.outputs.total }} total, ${{ steps.results.outputs.passed }} passed, ${{ steps.results.outputs.failed }} failed, ${{ steps.results.outputs.skipped }} skipped"
      - name: Fail on test failures
        if: always()
        run: |
          if [ "${{ steps.e2e.outputs.exit_code }}" != "0" ]; then
            echo "::error::E2E tests failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/thriving-mobile/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: CI
    if: always()
    needs: [secret-scan, dependency-audit, dead-code-check, lint, typecheck, build, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
