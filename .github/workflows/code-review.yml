name: Code Review Council

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

concurrency:
  group: code-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    name: 9-Agent Code Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get diff
        run: git diff origin/main...HEAD > /tmp/diff.txt

      - name: Find plan file
        id: plan
        run: |
          BRANCH="${{ github.head_ref }}"
          SLUG="${BRANCH//\//-}"
          PLAN="plans/${SLUG}.md"
          if [ -f "$PLAN" ]; then
            echo "file=$PLAN" >> $GITHUB_OUTPUT
          else
            echo "file=" >> $GITHUB_OUTPUT
          fi

      - name: Run 9-agent review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIFF_FILE: /tmp/diff.txt
          PLAN_FILE: ${{ steps.plan.outputs.file }}
        run: node .github/scripts/code-review.js > /tmp/review-results.json || true

      - name: Post review comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const raw = fs.readFileSync('/tmp/review-results.json', 'utf8');
              const results = JSON.parse(raw);
              const icon = (v) => v === 'APPROVED' ? '✅' : v === 'WARN' ? '⚠️' : '❌';
              const rows = results.results.map((r, i) =>
                `| ${i+1} | ${r.name} | ${icon(r.verdict)} ${r.verdict} | ${(r.reason || '').substring(0, 200).replace(/\n/g, ' ')} |`
              ).join('\n');
              const warns = results.results.filter(r => r.verdict === 'WARN');
              const status = results.approved ? '✅ All agents approved' : '❌ Review failed';
              let warnSection = '';
              if (warns.length > 0) {
                const warnRows = warns.map(w => `- **${w.name}**: ${(w.reason || '').substring(0, 300).replace(/\n/g, ' ')}`).join('\n');
                warnSection = `\n\n### Pre-existing issues (not blocking)\n${warnRows}`;
              }
              body = `## Code Review Council\n\n${status}\n\n| # | Agent | Verdict | Summary |\n|---|-------|---------|--------|\n${rows}${warnSection}\n\n_Reviewed commit: \`${context.sha.substring(0,7)}\`_`;
            } catch (e) {
              body = `## Code Review Council\n\n❌ Review failed — could not parse results.\n\nError: ${e.message}\n\nCheck the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            }
            const comments = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number
            });
            const existing = comments.data.find(c => c.body && c.body.startsWith('## Code Review Council'));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Check review result
        run: |
          if [ ! -f /tmp/review-results.json ]; then
            echo "No review results — review script failed"
            exit 1
          fi
          node -e "const r=JSON.parse(require('fs').readFileSync('/tmp/review-results.json','utf8'));process.exit(r.approved?0:1)"
