<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Nick & Erin's AI Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,sans-serif;background:#0A0E1A;color:#E2E8F0;padding:20px 24px;max-width:1400px;margin:0 auto}
.mono{font-family:'JetBrains Mono',monospace}

/* ── Header ── */
.hdr{display:flex;justify-content:space-between;align-items:center;padding:0 0 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.hdr h1{font-size:17px;font-weight:600;color:#F1F5F9}
.hdr-sub{display:flex;align-items:center;gap:8px;font-size:11px;color:#64748B;margin:2px 0 0}
.hdr-right{display:flex;align-items:center;gap:8px}
.live{font-size:11px;font-family:'JetBrains Mono',monospace;color:#14B8A6}
.live.error{color:#EF4444}
.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#14B8A6;margin-right:4px;vertical-align:middle;animation:pulse 2s ease-in-out infinite}
.status-dot.error{background:#EF4444;animation:none}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(20,184,166,0.4)}50%{opacity:0.7;box-shadow:0 0 0 4px rgba(20,184,166,0)}}

.date-input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94A3B8;font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 6px;border-radius:4px;cursor:pointer;color-scheme:dark}
.date-input:focus{outline:1px solid rgba(59,130,246,0.5);border-color:rgba(59,130,246,0.3)}

/* ── Section Label ── */
.sl{font-size:10px;font-weight:600;letter-spacing:1px;color:#475569;margin:16px 0 8px;text-transform:uppercase}

/* ── Human Cards ── */
.humans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.human-card{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.human-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.hc-nick::before{background:#3B82F6}
.hc-erin::before{background:#A78BFA}
.hc-top{display:flex;justify-content:space-between;align-items:flex-start;margin:0 0 12px}
.hc-name{font-size:16px;font-weight:600;color:#F1F5F9}
.hc-hours{font-size:11px;color:#64748B;font-family:'JetBrains Mono',monospace;margin:2px 0 0}
.hc-stats{display:flex;gap:16px}
.hc-stat{text-align:center}
.hc-stat-num{font-size:20px;font-weight:600;font-family:'JetBrains Mono',monospace}
.hc-stat-num.blue{color:#60A5FA}
.hc-stat-num.purple{color:#A78BFA}
.hc-stat-label{font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:0.5px}

/* Timeline */
.hc-timeline{display:flex;gap:2px;margin:12px 0 0;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,0.04)}
.tl-block{height:100%;border-radius:1px}
.tl-active{background:#3B82F6}
.tl-active-e{background:#A78BFA}
.tl-gap{background:transparent}
.tl-labels{display:flex;justify-content:space-between;font-size:9px;color:#475569;margin:4px 0 0;font-family:'JetBrains Mono',monospace}

/* Accomplishments */
.hc-wins{margin:12px 0 0}
.win{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:11px;color:#94A3B8;line-height:1.4}
.win-dot{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.win-dot-nick{background:#3B82F6}
.win-dot-erin{background:#A78BFA}
.win strong{color:#E2E8F0;font-weight:500}
.win-via{color:#475569;font-style:italic}

/* ── Agent Bar ── */
.agents-bar{display:flex;gap:8px;margin:0 0 4px}
.ag-mini{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:8px 12px;flex:1;display:flex;align-items:center;gap:8px;cursor:pointer;transition:border-color 0.2s}
.ag-mini:hover,.ag-mini.active{border-color:rgba(59,130,246,0.3)}
.ag-av{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;font-family:'JetBrains Mono',monospace}
.av-blue{background:rgba(59,130,246,0.12);color:#60A5FA}
.av-purple{background:rgba(139,92,246,0.12);color:#A78BFA}
.av-teal{background:rgba(20,184,166,0.12);color:#2DD4BF}
.ag-info{flex:1}
.ag-name{font-size:12px;font-weight:600;color:#CBD5E1}
.ag-title{font-size:9px;color:#475569}
.ag-when{font-size:9px;color:#475569;font-family:'JetBrains Mono',monospace;text-align:right}

/* ── Agent Expand Panel ── */
.agent-expand{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin:8px 0 16px;display:none}
.agent-expand.open{display:block}
.ae-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;padding:0 0 8px;border-bottom:1px solid rgba(255,255,255,0.06)}
.ae-title{font-size:13px;font-weight:600;color:#F1F5F9}
.ae-close{font-size:10px;color:#475569;cursor:pointer;padding:2px 6px;border-radius:4px}
.ae-close:hover{color:#94A3B8;background:rgba(255,255,255,0.06)}

/* ── Grid ── */
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}

/* ── Panel ── */
.panel{background:#111827;border:1px solid rgba(255,255,255,0.06);border-radius:12px;overflow:hidden}
.panel-head{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:12px;font-weight:600;color:#F1F5F9}
.panel-count{font-size:10px;color:#475569;font-family:'JetBrains Mono',monospace}

/* ── Feed Items ── */
.fi{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.fi:last-child{border-bottom:none}
.fi-row{display:flex;align-items:center;gap:6px;margin:0 0 4px}
.fi-av-sm{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:600;font-family:'JetBrains Mono',monospace}
.fi-name{font-size:11px;font-weight:600;color:#CBD5E1}
.fi-arrow{font-size:10px;color:#475569}
.fi-to{font-size:11px;color:#94A3B8}
.fi-badge{font-size:9px;padding:1px 6px;border-radius:4px;font-weight:600;font-family:'JetBrains Mono',monospace}
.b-prog{background:rgba(59,130,246,0.12);color:#60A5FA}
.b-dec{background:rgba(139,92,246,0.12);color:#A78BFA}
.b-rec{background:rgba(245,158,11,0.12);color:#FBBF24}
.b-ins{background:rgba(20,184,166,0.12);color:#2DD4BF}
.b-res{background:rgba(34,197,94,0.12);color:#4ADE80}
.b-blk{background:rgba(239,68,68,0.12);color:#F87171}
.b-ctx{background:rgba(255,255,255,0.06);color:#94A3B8}
.b-warn{background:rgba(245,158,11,0.12);color:#FBBF24}
.fi-time{font-size:9px;color:#475569;margin-left:auto;font-family:'JetBrains Mono',monospace}
.fi-text{font-size:11px;color:#94A3B8;line-height:1.5}
.fi-human{font-size:9px;color:#475569;margin:3px 0 0;font-family:'JetBrains Mono',monospace}

/* ── Open Items ── */
.oi{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)}
.oi:last-child{border-bottom:none}
.oi-row{display:flex;align-items:center;gap:6px;margin:0 0 3px}
.oi-urg{font-size:8px;padding:1px 5px;border-radius:3px;font-weight:700;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.3px}
.urg-now{background:rgba(239,68,68,0.12);color:#F87171;border:1px solid rgba(239,68,68,0.2)}
.urg-week{background:rgba(245,158,11,0.12);color:#FBBF24;border:1px solid rgba(245,158,11,0.2)}
.urg-ready{background:rgba(255,255,255,0.04);color:#64748B;border:1px solid rgba(255,255,255,0.06)}
.oi-text{font-size:11px;color:#CBD5E1;line-height:1.4}
.oi-from{font-size:10px;color:#475569;margin:3px 0 0;font-family:'JetBrains Mono',monospace}
.oi-from span{color:#94A3B8}
.dec-by{font-size:10px;color:#475569;margin:3px 0 0;font-family:'JetBrains Mono',monospace}
.dec-by span{color:#94A3B8}

/* ── Error & Loading ── */
.error-banner{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:10px;padding:10px 14px;color:#F87171;font-size:11px;display:none;margin:12px 0}
.error-banner.visible{display:block}
.empty-state{padding:20px;text-align:center;color:#475569;font-size:11px}
.loading-state{padding:24px;text-align:center;color:#475569;font-size:11px}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div>
    <h1>Nick and Erin's AI Fleet</h1>
    <div class="hdr-sub">
      <span id="dateDisplay">Loading...</span>
      <input type="date" id="datePicker" class="date-input" title="Pick a date">
    </div>
  </div>
  <div class="hdr-right">
    <span class="status-dot" id="statusDot"></span>
    <span class="live" id="statusText">connecting...</span>
  </div>
</div>

<div class="error-banner" id="errorBanner"></div>

<!-- Scoreboard -->
<div class="sl">Today's scoreboard</div>
<div class="humans" id="humans">
  <div class="loading-state">Loading fleet data...</div>
</div>

<!-- Fleet Agents -->
<div class="sl">Fleet agents</div>
<div class="agents-bar" id="agentsBar">
  <div class="loading-state">Loading agents...</div>
</div>
<div class="agent-expand" id="agentExpand"></div>

<!-- Grid -->
<div class="grid2">
  <div>
    <div class="sl">Fleet chatter</div>
    <div class="panel" id="chatterPanel">
      <div class="panel-head">
        <span class="panel-title">Who said what to whom</span>
        <span class="panel-count" id="chatterCount">&mdash;</span>
      </div>
      <div id="chatterBody"><div class="loading-state">Loading...</div></div>
    </div>
  </div>
  <div>
    <div class="sl">Open items</div>
    <div class="panel" id="openPanel" style="margin:0 0 12px">
      <div class="panel-head">
        <span class="panel-title">Awaiting action</span>
        <span class="panel-count" id="openCount" style="color:#FBBF24">&mdash;</span>
      </div>
      <div id="openBody"><div class="loading-state">Loading...</div></div>
    </div>
    <div class="sl">Decisions made today</div>
    <div class="panel" id="decisionsPanel">
      <div class="panel-head">
        <span class="panel-title">Decided</span>
        <span class="panel-count" id="decisionsCount">&mdash;</span>
      </div>
      <div id="decisionsBody"><div class="loading-state">Loading...</div></div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
var currentData = null;
var selectedDate = null;
var expandedAgent = null;
var lastFetchOk = false;

// ── Config ─────────────────────────────────────────────────
var KIND_LABELS = {
  progress:'progress', recommendation:'rec', insight:'insight',
  blocker:'blocker', blocker_resolved:'resolved', decision:'decision',
  context:'context', question:'question', warning:'warning'
};
var KIND_CLASSES = {
  progress:'b-prog', recommendation:'b-rec', insight:'b-ins',
  blocker:'b-blk', blocker_resolved:'b-res', decision:'b-dec',
  context:'b-ctx', warning:'b-warn', question:'b-dec'
};
var URGENCY_ORDER = {now:0,'this-week':1,this_week:1,'when-ready':2,when_ready:2,fyi:3};
var AGENT_COLORS = ['av-blue','av-purple','av-teal'];
var NAME_COLORS = {Tobias:0, Lilly:1, Luke:2};

// ── Helpers ────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

function tAgo(dateStr) {
  if (!dateStr) return '';
  var s = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (s < 0) return '0s';
  if (s < 60) return s + 's';
  var m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}

function fmtET(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-US', {
    timeZone:'America/New_York', hour:'numeric', minute:'2-digit', hour12:true
  });
}

function fmtDate(ds) {
  var p = ds.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return d.toLocaleDateString('en-US', {
    weekday:'long', year:'numeric', month:'long', day:'numeric'
  });
}

function agName(id) {
  if (!currentData || !currentData.agent_map || !id) return id || 'unknown';
  var info = currentData.agent_map[id];
  return info ? info.display_name : id;
}

function agOwner(id) {
  if (!currentData || !currentData.agent_map || !id) return 'unknown';
  var info = currentData.agent_map[id];
  return info ? info.owner : 'unknown';
}

function agColorCls(id) {
  var name = agName(id);
  var idx = NAME_COLORS[name];
  if (idx === undefined) {
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h + name.charCodeAt(i)) % 3;
    idx = h;
  }
  return AGENT_COLORS[idx];
}

// ── Timeline ───────────────────────────────────────────────
function computeTimeline(timestamps) {
  var START = 420, END = 1140, BLOCK = 30;
  var NUM = (END - START) / BLOCK;
  var blocks = new Array(NUM).fill(false);
  for (var j = 0; j < timestamps.length; j++) {
    var d = new Date(timestamps[j]);
    var etStr = d.toLocaleTimeString('en-US', {
      timeZone:'America/New_York', hour12:false, hour:'2-digit', minute:'2-digit'
    });
    var parts = etStr.split(':');
    var mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    var idx = Math.floor((mins - START) / BLOCK);
    if (idx >= 0 && idx < NUM) blocks[idx] = true;
  }
  var segs = [], k = 0;
  while (k < NUM) {
    var active = blocks[k], count = 0;
    while (k < NUM && blocks[k] === active) { count++; k++; }
    segs.push({active:active, width:(count / NUM * 100).toFixed(1)});
  }
  return segs;
}

// ── Render: Stats helper ───────────────────────────────────
function renderStat(value, label, colorCls) {
  return '<div class="hc-stat"><div class="hc-stat-num ' + colorCls + '">'
    + value + '</div><div class="hc-stat-label">' + label + '</div></div>';
}

// ── Render: Human Cards ────────────────────────────────────
function renderHumanCard(name, stats, colorCls, dotCls, tlCls) {
  var hours = !stats.active_start ? 'No activity today'
    : stats.active_start === stats.active_end ? fmtET(stats.active_start)
    : fmtET(stats.active_start) + ' - ' + fmtET(stats.active_end) + ' (active)';
  var segs = computeTimeline(stats.post_timestamps);
  var tlHtml = segs.map(function(s) {
    return '<div class="tl-block ' + (s.active ? tlCls : 'tl-gap') + '" style="width:' + s.width + '%"></div>';
  }).join('');
  var wins = stats.accomplishments.slice(0, 8).map(function(a) {
    return '<div class="win"><span class="win-dot ' + dotCls + '"></span>'
      + '<strong>' + esc(a.summary) + '</strong> <span class="win-via">via ' + esc(a.via) + '</span></div>';
  }).join('');
  return '<div class="human-card hc-' + name.toLowerCase() + '"><div class="hc-top"><div>'
    + '<div class="hc-name">' + esc(name) + '</div><div class="hc-hours">' + hours + '</div></div>'
    + '<div class="hc-stats">' + renderStat(stats.progress_count, 'PRs shipped', colorCls)
    + renderStat(stats.decisions, 'Decisions', colorCls) + renderStat(stats.posts, 'Posts', colorCls) + '</div></div>'
    + '<div class="hc-timeline">' + tlHtml + '</div>'
    + '<div class="tl-labels"><span>7 AM</span><span>10 AM</span><span>1 PM</span><span>4 PM</span><span>7 PM</span></div>'
    + '<div class="hc-wins">' + (wins || '<div class="empty-state">No wins recorded yet</div>') + '</div></div>';
}

function renderHumans() {
  if (!currentData || !currentData.human_stats) return;
  var el = document.getElementById('humans');
  var hs = currentData.human_stats;
  el.innerHTML = renderHumanCard('Nick', hs.nick, 'blue', 'win-dot-nick', 'tl-active')
    + renderHumanCard('Erin', hs.erin, 'purple', 'win-dot-erin', 'tl-active-e');
}

// ── Render: Agent Bar ──────────────────────────────────────
function renderAgentBar() {
  if (!currentData) return;
  var agents = currentData.agents;
  var el = document.getElementById('agentsBar');
  if (!agents || !agents.length) {
    el.innerHTML = '<div class="empty-state">No agents registered</div>';
    return;
  }
  el.innerHTML = agents.map(function(a) {
    var colorCls = agColorCls(a.agent_id);
    var initial = (a.display_name || a.agent_id || '?').charAt(0).toUpperCase();
    var title = (a.role || '').split(' — ')[0].split(',')[0];
    if (title.length > 30) title = title.slice(0, 28) + '...';
    var when = a.updated_at ? tAgo(a.updated_at) + ' ago' : 'never';
    var activeCls = expandedAgent === a.agent_id ? ' active' : '';
    return '<div class="ag-mini' + activeCls + '" data-agent-id="' + esc(a.agent_id) + '">'
      + '<div class="ag-av ' + colorCls + '">' + initial + '</div>'
      + '<div class="ag-info"><div class="ag-name">' + esc(a.display_name || a.agent_id) + '</div>'
      + '<div class="ag-title">' + esc(title) + '</div></div>'
      + '<div class="ag-when">' + when + '</div></div>';
  }).join('');
}

// ── Render: Agent Expand ───────────────────────────────────
function renderExpandPanel(agentId) {
  var el = document.getElementById('agentExpand');
  if (!agentId || !currentData) { el.classList.remove('open'); return; }
  var agent = currentData.agent_map[agentId] || {display_name: agentId, role: ''};
  var msgs = currentData.messages.filter(function(m) { return m.agent_id === agentId; });
  var items = msgs.map(function(m) {
    var badgeCls = KIND_CLASSES[m.kind] || 'b-ctx';
    var label = KIND_LABELS[m.kind] || m.kind || 'update';
    var toName = m.to_agent ? agName(m.to_agent) : 'all';
    return '<div class="fi"><div class="fi-row">'
      + '<span class="fi-badge ' + badgeCls + '">' + esc(label) + '</span>'
      + '<span class="fi-arrow">to</span><span class="fi-to">' + esc(toName) + '</span>'
      + '<span class="fi-time">' + tAgo(m.created_at) + '</span></div>'
      + '<div class="fi-text">' + esc(m.summary || '') + '</div></div>';
  }).join('');
  el.innerHTML = '<div class="ae-head"><div class="ae-title">' + esc(agent.display_name)
    + ' &middot; ' + esc(agent.role || '') + '</div>'
    + '<span class="ae-close" id="aeClose">close</span></div>'
    + (items || '<div class="empty-state">No posts today</div>');
  el.classList.add('open');
  document.getElementById('aeClose').addEventListener('click', function() { onAgentClick(null); });
}

// ── Render: Fleet Chatter ──────────────────────────────────
function renderChatterItem(m) {
  var name = agName(m.agent_id);
  var initial = name.charAt(0).toUpperCase();
  var toName = m.to_agent ? agName(m.to_agent) : 'all';
  var badgeCls = KIND_CLASSES[m.kind] || 'b-ctx';
  var label = KIND_LABELS[m.kind] || m.kind || 'update';
  var owner = agOwner(m.agent_id);
  var session = owner === 'nick' ? "Nick's session" : owner === 'erin' ? "Erin's session" : owner === 'both' ? 'Shared' : '';
  return '<div class="fi"><div class="fi-row">'
    + '<div class="fi-av-sm ' + agColorCls(m.agent_id) + '">' + initial + '</div>'
    + '<span class="fi-name">' + esc(name) + '</span><span class="fi-arrow">to</span>'
    + '<span class="fi-to">' + esc(toName) + '</span>'
    + '<span class="fi-badge ' + badgeCls + '">' + esc(label) + '</span>'
    + '<span class="fi-time">' + tAgo(m.created_at) + '</span></div>'
    + '<div class="fi-text">' + esc(m.summary || '') + '</div>'
    + '<div class="fi-human">' + esc(session) + '</div></div>';
}

function renderChatter() {
  if (!currentData) return;
  var msgs = currentData.messages;
  document.getElementById('chatterCount').textContent = msgs.length + ' messages today';
  var body = document.getElementById('chatterBody');
  if (!msgs.length) { body.innerHTML = '<div class="empty-state">No messages today</div>'; return; }
  body.innerHTML = msgs.map(renderChatterItem).join('');
}

// ── Render: Open Items ─────────────────────────────────────
function renderOpenItem(item) {
  var urg = (item.urgency || 'when-ready').replace(/_/g, '-');
  var urgCls = urg === 'now' ? 'urg-now' : urg === 'this-week' ? 'urg-week' : 'urg-ready';
  var urgLabel = urg === 'fyi' ? '' : urg.replace(/-/g, ' ');
  var from = agName(item.agent_id);
  var to = item.to_agent ? agName(item.to_agent) : 'all';
  return '<div class="oi">'
    + (urgLabel ? '<div class="oi-row"><span class="oi-urg ' + urgCls + '">' + esc(urgLabel) + '</span></div>' : '')
    + '<div class="oi-text">' + esc(item.summary || '') + '</div>'
    + '<div class="oi-from"><span>' + esc(from) + '</span> to <span>' + esc(to) + '</span></div></div>';
}

function renderOpenItems() {
  if (!currentData) return;
  var items = currentData.open_items.slice().sort(function(a, b) {
    return (URGENCY_ORDER[a.urgency] || 99) - (URGENCY_ORDER[b.urgency] || 99);
  });
  document.getElementById('openCount').textContent = items.length + ' open';
  var body = document.getElementById('openBody');
  if (!items.length) { body.innerHTML = '<div class="empty-state">All clear</div>'; return; }
  body.innerHTML = items.map(renderOpenItem).join('');
}

// ── Render: Decisions ──────────────────────────────────────
function renderDecisions() {
  if (!currentData) return;
  var decs = currentData.decisions;
  document.getElementById('decisionsCount').textContent = decs.length + ' today';
  var body = document.getElementById('decisionsBody');
  if (!decs.length) { body.innerHTML = '<div class="empty-state">No decisions today</div>'; return; }
  body.innerHTML = decs.map(function(d) {
    return '<div class="oi"><div class="oi-text">' + esc(d.decision || '') + '</div>'
      + '<div class="dec-by">decided by <span>' + esc(d.decided_by || 'unknown') + '</span></div></div>';
  }).join('');
}

// ── Status ─────────────────────────────────────────────────
function updateStatus() {
  var dot = document.getElementById('statusDot');
  var text = document.getElementById('statusText');
  if (lastFetchOk) {
    dot.className = 'status-dot';
    text.className = 'live';
    text.textContent = 'systems online';
  } else {
    dot.className = 'status-dot error';
    text.className = 'live error';
    text.textContent = 'connection issue';
  }
}

// ── Render All ─────────────────────────────────────────────
function renderAll() {
  renderHumans();
  renderAgentBar();
  renderChatter();
  renderOpenItems();
  renderDecisions();
  if (expandedAgent) renderExpandPanel(expandedAgent);
  updateStatus();
}

// ── Fetch ──────────────────────────────────────────────────
function fetchDashboard(date) {
  var url = '/.netlify/functions/fleet-dashboard';
  if (date) url += '?date=' + encodeURIComponent(date);
  var banner = document.getElementById('errorBanner');
  fetch(url)
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      lastFetchOk = true;
      banner.classList.remove('visible');
      currentData = data;
      if (data.date) {
        document.getElementById('dateDisplay').textContent = fmtDate(data.date);
        document.getElementById('datePicker').value = data.date;
      }
      renderAll();
    })
    .catch(function(err) {
      lastFetchOk = false;
      var reason = err && err.message ? err.message : 'Network error';
      banner.textContent = 'Failed to load fleet data (' + reason + ') \u2014 retrying in 30s';
      banner.classList.add('visible');
      updateStatus();
    });
}

// ── Event Handlers ─────────────────────────────────────────
function onAgentClick(agentId) {
  if (expandedAgent === agentId || agentId === null) {
    expandedAgent = null;
    document.getElementById('agentExpand').classList.remove('open');
  } else {
    expandedAgent = agentId;
    renderExpandPanel(agentId);
  }
  renderAgentBar();
}

document.getElementById('agentsBar').addEventListener('click', function(e) {
  var card = e.target.closest('.ag-mini');
  if (!card) return;
  onAgentClick(card.getAttribute('data-agent-id'));
});

document.getElementById('datePicker').addEventListener('change', function(e) {
  selectedDate = e.target.value || null;
  expandedAgent = null;
  document.getElementById('agentExpand').classList.remove('open');
  fetchDashboard(selectedDate);
});

// ── Init ───────────────────────────────────────────────────
fetchDashboard();
setInterval(function() { fetchDashboard(selectedDate); }, 30000);
setInterval(updateStatus, 5000);
</script>
</body>
</html>
